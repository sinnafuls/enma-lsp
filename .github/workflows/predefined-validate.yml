name: Validate predefined

on:
  pull_request:
    paths:
      - 'data/enma-stdlib.json'
      - 'tools/regenerate-stdlib.mjs'
      - 'tools/validate-predefined.mjs'
      - 'server/src/compiler_tokenizer/**'
      - 'server/src/compiler_parser/**'
      - 'server/src/predefined/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run validate-predefined
